spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestaoInventario}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Carrega o seed (data.sql) somente apos o Hibernate criar/atualizar o schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Segredo de assinatura dos tokens (>= 32 caracteres). Sem ele, um segredo temporario e gerado
# a cada inicializacao e as sessoes expiram quando o servidor reinicia.
app.jwt.secret=${JWT_SECRET:}
app.jwt.session-hours=12
app.jwt.remember-days=7

# Gera (uma unica vez) custos, fornecedores e historico de movimentacoes de demonstracao.
app.demo-data.enabled=${DEMO_DATA:true}

# Anexo da nota fiscal (PDF, XML ou imagem da NF-e)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
