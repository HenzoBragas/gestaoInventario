spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestaoInventario}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Carrega o seed (data.sql) somente apos o Hibernate criar/atualizar o schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Segredo de assinatura dos tokens (>= 32 caracteres). Sem ele, um segredo temporario e gerado
# a cada inicializacao e as sessoes expiram quando o servidor reinicia.
app.jwt.secret=${JWT_SECRET:}
app.jwt.session-hours=12
app.jwt.remember-days=7

# Gera (uma unica vez) custos, fornecedores e historico de movimentacoes de demonstracao.
app.demo-data.enabled=${DEMO_DATA:true}

# ---- Integracao com marketplaces: vendas pagas baixam o estoque de forma assincrona ----
# Webhooks: POST /integrations/webhooks/mercadolivre e /integrations/webhooks/shopee
# O SKU do anuncio (seller_sku no ML, model_sku/item_sku na Shopee) deve ser igual ao codigo do produto.
app.marketplace.mercadolivre.enabled=${ML_ENABLED:false}
app.marketplace.mercadolivre.client-id=${ML_CLIENT_ID:}
app.marketplace.mercadolivre.client-secret=${ML_CLIENT_SECRET:}
app.marketplace.mercadolivre.refresh-token=${ML_REFRESH_TOKEN:}
app.marketplace.mercadolivre.seller-id=${ML_SELLER_ID:}

app.marketplace.shopee.enabled=${SHOPEE_ENABLED:false}
app.marketplace.shopee.api-url=${SHOPEE_API_URL:https://partner.shopeemobile.com}
app.marketplace.shopee.partner-id=${SHOPEE_PARTNER_ID:}
app.marketplace.shopee.partner-key=${SHOPEE_PARTNER_KEY:}
app.marketplace.shopee.shop-id=${SHOPEE_SHOP_ID:}
app.marketplace.shopee.refresh-token=${SHOPEE_REFRESH_TOKEN:}
app.marketplace.shopee.push-url=${SHOPEE_PUSH_URL:}

# Somente desenvolvimento: POST /integrations/simulate/{mercadolivre|shopee} simula vendas sem conta real.
app.marketplace.simulation.enabled=${MARKETPLACE_SIMULATION:false}

app.marketplace.worker.max-attempts=8
app.marketplace.worker.poll-interval-ms=30000

# Anexo da nota fiscal (PDF, XML ou imagem da NF-e)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
