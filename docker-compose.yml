services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-gestaoInventario}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gestaoInventario}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: 8080
      MARKETPLACE_SIMULATION: ${MARKETPLACE_SIMULATION:-false}
      ML_ENABLED: ${ML_ENABLED:-false}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      ML_REFRESH_TOKEN: ${ML_REFRESH_TOKEN:-}
      ML_SELLER_ID: ${ML_SELLER_ID:-}
      SHOPEE_ENABLED: ${SHOPEE_ENABLED:-false}
      SHOPEE_API_URL: ${SHOPEE_API_URL:-https://partner.shopeemobile.com}
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_SHOP_ID: ${SHOPEE_SHOP_ID:-}
      SHOPEE_REFRESH_TOKEN: ${SHOPEE_REFRESH_TOKEN:-}
      SHOPEE_PUSH_URL: ${SHOPEE_PUSH_URL:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/products}
    restart: always
    depends_on:
      - backend
    environment:
      PORT: 3000
      BACKEND_URL: "http://backend:8080"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
